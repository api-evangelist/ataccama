description: Ataccama provides an agentic data trust platform that combines data quality, observability, lineage, governance and master data management.
  Their solutions help enterprises accelerate business initiatives with trusted, high‑quality data, supporting AI, analytics and compliance across
  industries such as finance, insurance and manufacturing. The platform includes modules for data quality, catalog, lineage, reference data, and
  data observability, delivering a unified data trust foundation.

